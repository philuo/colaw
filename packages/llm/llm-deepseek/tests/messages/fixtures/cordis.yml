- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-session-projection'
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
- name: '@deepseek-ai/dsh-settings-file'
  config:
    path: {{settings}}
    watch: false
- name: '@deepseek-ai/dsh-credentials-local'
  config:
    path: {{credentials}}
    watch: false
- name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    # Messages is this composition's subject, and it is no longer the schema
    # default — the default is chat completions, because the Models page offers
    # a `baseURL` and a catalog and no protocol switch. A composition that means
    # to exercise Messages has to say so.
    protocol: anthropic-messages
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: {{endpoint}}
    thinking: enabled
    reasoningEffort: high
    maxTokens: 256000
    streamIdleTimeoutMs: 300000
