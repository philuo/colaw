# Electrobun (Bun runtime) desktop host overlay patch.
# Applied on top of the web profile (base + web-app).
# We keep dsh's own webserver running; Electrobun simply loads its URL in a window.
#
# A patch row REPLACES the targeted row's whole `config`, so every row below
# restates all keys the bundle row owns.

# ── Disable plugins not needed in the bundled Electrobun app ──

# The tokenrhythm relay rejects the vendor-private `dsh_plugin_packages`
# request field (HTTP 400 INVALID_REQUEST); keep the extension off in the app.
- id: plugin-package-inventory-deepseek
  config:
    enabled: false

# The desktop shell's session header keeps only the open-locally pill and the
# right-panel toggle; drop the session-log download action.
- id: session-log-download
  disabled: true

# The desktop product has its own support channel; the in-composer feedback
# command is noise here. Dropped from the "/" menu and the command catalog.
- id: command-feedback
  disabled: true

# Don't print the URL or hand off to the default browser; Electrobun owns the
# window. The loader entry id is `web-runtime` (plugin name `web-app`).
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

# Dedicated port (avoid the 3080 dev instance); restate the bundle's full config.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3090
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# The dev app keeps the hot-reload poll tight: the host notices a rebuilt
# plugin bundle within ~100ms instead of the default 500ms, so a source save
# reaches the running view in a few hundred milliseconds end to end. Polling
# (vs. fs events) stays the mechanism — network mounts deliver no inotify.
- id: client-hmr
  config:
    pollIntervalMs: 100

# ── Built-in remote MCP services (product-shipped integrations) ──
#
# Endpoints only — the bearer keys live in the credentials store
# (PKULAW_API_KEY / QCC_API_KEY / FIRECRAWL_API_KEY), entered under
# Settings → General → 内置服务密钥. The keyring resolves each reference at
# startup and mounts one mcp-client per server; a missing key still mounts
# the server (calls fail with the provider's 401), and a newly entered key
# applies on the next app start.

- insert:
    - id: mcp-keyring
      name: '@deepseek-ai/dsh-mcp-keyring'
      config:
        toolCallTimeoutMs: 180000
        servers:
          - serverName: pkulaw-law-search
            url: https://apim-gateway.pkulaw.com/mcp-law-search-service
            credentialRef: PKULAW_API_KEY
          - serverName: pkulaw-law-keyword
            url: https://apim-gateway.pkulaw.com/mcp-law
            credentialRef: PKULAW_API_KEY
          - serverName: pkulaw-case-semantic-search
            url: https://apim-gateway.pkulaw.com/mcp-case-search-service
            credentialRef: PKULAW_API_KEY
          - serverName: pkulaw-case-keyword
            url: https://apim-gateway.pkulaw.com/mcp-case
            credentialRef: PKULAW_API_KEY
          - serverName: pkulaw-law-item-keyword
            url: https://apim-gateway.pkulaw.com/mcp-fatiao
            credentialRef: PKULAW_API_KEY
          - serverName: pkulaw-law-recognition
            url: https://apim-gateway.pkulaw.com/law_recognition
            credentialRef: PKULAW_API_KEY
          - serverName: pkulaw-case-number-recognition
            url: https://apim-gateway.pkulaw.com/case_number_recognition
            credentialRef: PKULAW_API_KEY
          - serverName: pkulaw-citation-validator
            url: https://apim-gateway.pkulaw.com/pku_citation_validator
            credentialRef: PKULAW_API_KEY
          - serverName: qcc-company
            url: https://agent.qcc.com/mcp/company/stream
            credentialRef: QCC_API_KEY
          - serverName: qcc-risk
            url: https://agent.qcc.com/mcp/risk/stream
            credentialRef: QCC_API_KEY
          - serverName: qcc-ipr
            url: https://agent.qcc.com/mcp/ipr/stream
            credentialRef: QCC_API_KEY
          - serverName: qcc-operation
            url: https://agent.qcc.com/mcp/operation/stream
            credentialRef: QCC_API_KEY
          - serverName: qcc-history
            url: https://agent.qcc.com/mcp/history/stream
            credentialRef: QCC_API_KEY
          - serverName: qcc-executive
            url: https://agent.qcc.com/mcp/executive/stream
            credentialRef: QCC_API_KEY
          - serverName: qcc-legal-regulation
            url: https://agent.qcc.com/mcp/regulation/stream
            credentialRef: QCC_API_KEY
          - serverName: qcc-legal-case
            url: https://agent.qcc.com/mcp/case/stream
            credentialRef: QCC_API_KEY
          - serverName: qcc-tender
            url: https://agent.qcc.com/mcp/tender/stream
            credentialRef: QCC_API_KEY
          - serverName: firecrawl
            url: https://mcp.firecrawl.dev/v2/mcp
            credentialRef: FIRECRAWL_API_KEY

# MinerU 文档解析 tool: cloud PDF/Office → Markdown (mineru.net 精准解析 API).
# The token resolves per call from MINERU_API_KEY (Settings → General),
# so a newly entered key applies immediately.
- insert:
    - id: tool-mineru
      name: '@deepseek-ai/dsh-tool-mineru'
      config: {}
