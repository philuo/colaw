# Colaw release build (macOS arm64 only) from the deepseek-harness tree.
#
# Two-stage packaging, matching the verified local chain:
#   1. scripts/pack-stable-app.ts — the product closure (Bun runs every build
#      script; corepack-activated pnpm only installs the workspace).
#   2. `hutch electrobun build --env=stable` — the OFFICIAL release identity:
#      version.json hash (Electrobun's algorithm), update.json manifest, and
#      automatic bsdiff patches against the previously published release on
#      the update base URL. The packer's closure merges into Hutch's shell
#      through the postBuild hook (COLAW_PACK_STAGING).
#
# The update base URL is this repo's GitHub Releases (stable channel via
# releases/latest/download, per Electrobun's updates guide). Assets:
#   - Colaw-stable.dmg, Colaw-macos-arm64.app.zip — human downloads
#   - stable-macos-arm64-Colaw.app.tar.zst, -update.json, -<hash>.patch —
#     the auto-updater's static files (Release assets double as the server)
#
# Triggers: push to main builds artifacts; push of a v* tag (or dispatch with
# a tag) additionally publishes a GitHub Release with every asset. Same-tag
# re-runs clobber assets, keeping releases/latest/download URLs stable.
# Versions are semver tags (vMAJOR.MINOR.PATCH) — bump
# apps/electrobun-host/electrobun.config.ts in the same commit as the tag.

name: colaw-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1). Empty builds artifacts only."
        required: false
        default: ""

permissions:
  contents: write

env:
  COLAW_UPDATE_BASE_URL: https://github.com/philuo/colaw/releases/latest/download
  COLAW_PACK_STAGING: /tmp/pack-staging

jobs:
  macos-arm64:
    runs-on: macos-14 # GitHub-hosted Apple Silicon
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Project the Electrobun devkit (.hutch is not committed)
        working-directory: apps/electrobun-host
        run: bun ./node_modules/electrobun/bin/electrobun.cjs prepare

      - name: Pack the product closure into the staging root
        run: |
          set -o pipefail
          echo "=== resources before pack ==="; df -h / /tmp; memory_pressure -Q 2>/dev/null | head -3 || sysctl hw.memsize
          bun scripts/pack-stable-app.ts 2>&1 | tee /tmp/pack-ci.log
          EXIT=$?
          echo "=== resources after pack (exit=$EXIT) ==="; df -h / /tmp
          exit $EXIT
          mkdir -p "$COLAW_PACK_STAGING"
          cp -R apps/electrobun-host/build/stable-macos-arm64/Colaw.app "$COLAW_PACK_STAGING/"

      - name: Ship the pack log back to the ci-debug branch
        if: always()
        run: |
          git config user.name "ci-debug-bot"
          git config user.email "ci-debug@users.noreply.github.com"
          git checkout -B ci-debug
          STAMP=$(date +%H%M%S)
          { echo "run: ${{ github.run_id }} commit: ${{ github.sha }}"; echo "df:"; df -h / /tmp; echo; cat /tmp/pack-ci.log 2>/dev/null || echo "(pack log absent — failed before tee)"; } > ".pack-ci-$STAMP.log"
          git add .pack-ci-*.log
          git commit -m "ci debug: pack log $STAMP"
          git push --force origin HEAD:ci-debug

      - name: Build the official release set (identity, manifest, patches)
        working-directory: apps/electrobun-host
        run: bun ./node_modules/electrobun/bin/electrobun.cjs build --env=stable

      - name: Build the drag-to-Applications installer image
        run: bun scripts/build-dmg.ts

      - name: Zip the shipped bundle (official identity, permissions-preserving)
        working-directory: apps/electrobun-host/build/stable-macos-arm64
        run: |
          ditto -c -k --keepParent Colaw.app Colaw-macos-arm64.app.zip
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: colaw-macos-arm64
          path: |
            apps/electrobun-host/build/stable-macos-arm64/Colaw.dmg
            apps/electrobun-host/build/stable-macos-arm64/Colaw-macos-arm64.app.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: colaw-update-feed
          path: apps/electrobun-host/artifacts/
          if-no-files-found: error

  publish:
    needs: macos-arm64
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/v')
        || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten for release assets
        run: |
          mkdir assets
          find dist -type f -exec cp {} assets/ \;
          ls -la assets/

      - name: Publish (create or overwrite same-tag assets)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" --clobber assets/*
